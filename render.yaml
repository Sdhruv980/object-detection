services:
  - type: web
    name: object-detection
    runtime: static
    buildCommand: node -e "const fs = require('fs'); const key = process.env.GEMINI_API_KEY || ''; fs.writeFileSync('config.js', 'window.GEMINI_API_KEY = ' + JSON.stringify(key) + ';');"
    staticPublishPath: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false
